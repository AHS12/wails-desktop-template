# The app's name, version and other details for the build.
# Don't change `info` here: it's written from appconfig/app.config.json by
# `make rename` and `make version`, and `make check` fails when it drifts.
version: '3'

info:
  companyName: "AHS12"
  productName: "wails-desktop-template"
  productIdentifier: "com.ahs12.wails-desktop-template"
  description: "A starter for desktop apps that feel like desktop apps."
  copyright: "© 2026 AHS12"
  comments: "A starter for desktop apps that feel like desktop apps."
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - graphify-out
      - specs
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
